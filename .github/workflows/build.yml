name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate transfer-partner data (served to installed apps from main)
        run: node -e "import('./lib/reference.mjs').then(m=>{const d=JSON.parse(require('fs').readFileSync('reference/transfer-partners.json','utf8'));const e=m.validateTransferData(d);if(e){console.error(e);process.exit(1)}console.log('transfer data OK',d.lastUpdated)})"

  windows-build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: PointPilot-installer
          path: dist/*.exe
          retention-days: 7
