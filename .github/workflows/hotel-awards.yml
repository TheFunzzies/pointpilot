name: Hotel awards refresh

# Weekly: rebuild reference/hotel-awards.json (MICHELIN Keys). Installed apps get it in the next release.
on:
  schedule:
    - cron: '41 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-hotel-awards.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- reference/hotel-awards.json; then echo "No changes"; exit 0; fi
          git config user.name "pointpilot-bot"
          git config user.email "pointpilot-bot@users.noreply.github.com"
          git add reference/hotel-awards.json
          git commit -m "data: MICHELIN Key hotels $(date -u +%F)"
          git push
