name: Transfer partner check

# Daily: compare reference/transfer-partners.json with Roame, Upgraded Points and The Points Guy.
# Changes that at least two sources agree on (or every source covering that currency) are
# committed to main; installed apps pick them up within 12 hours. Disagreements are listed in
# reference/transfer-check.md for review.
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transfer-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cross-check sources
        run: node scripts/check-transfers.mjs --write
      - name: Commit updated data
        run: |
          if git diff --quiet -- reference/; then echo "No changes"; exit 0; fi
          git config user.name "pointpilot-bot"
          git config user.email "pointpilot-bot@users.noreply.github.com"
          git add reference/transfer-partners.json reference/transfer-check.md
          git commit -m "data: transfer partner check $(date -u +%F)"
          git push
